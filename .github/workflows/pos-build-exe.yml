name: pos-build-exe

# Builds the Windows POS terminal installer (invoiceSolution.exe) on a Windows
# runner and uploads it as a downloadable artifact. UNSIGNED — no code-signing
# cert required, so this can run with zero secrets. Windows SmartScreen will
# warn "unknown publisher" on first install (More info → Run anyway); add a
# cert later (see pos-release.yml) to remove that warning.
#
# Trigger from the GitHub UI: Actions → pos-build-exe → Run workflow.
# Then download the "invoiceSolution-exe" artifact from the run summary.

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pos-terminal
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          # Cache the npm download cache so repeat builds skip re-downloading
          # every package (a big chunk of the wall-clock on a cold runner).
          cache: npm
          cache-dependency-path: pos-terminal/package-lock.json

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is a native module that must match ELECTRON's ABI, or
      # require() throws NODE_MODULE_VERSION at launch. `electron-builder
      # install-app-deps` (also our postinstall) DOWNLOADS the matching Electron
      # prebuild via prebuild-install — seconds, no MSVC compile. We run it
      # explicitly so the binary is correct before the verify step.
      #
      # NB: do NOT use `@electron/rebuild -f` here — the force flag compiles
      # better-sqlite3 from source with node-gyp/MSVC, which took 20+ minutes
      # (or stalled) on the Windows runner. The prebuild download is the fast,
      # supported path; we only fall back to a compile if no prebuild exists.
      - name: Fetch Electron-ABI native prebuilds
        run: npx --no-install electron-builder install-app-deps

      # Fail the build NOW (not on the customer's PC) if the native binary can't
      # load under Electron. Runs better-sqlite3 in a headless Electron main
      # process; a NODE_MODULE_VERSION / wrong-arch error exits non-zero.
      # NB: the script MUST be .cjs — package.json has "type": "module", so a
      # .js file is treated as ESM and `require` throws "require is not defined".
      - name: Verify better-sqlite3 loads under Electron
        shell: pwsh
        run: |
          @'
          const { app } = require("electron");
          app.whenReady().then(() => {
            try {
              const Database = require("better-sqlite3");
              const db = new Database(":memory:");
              db.prepare("select 1 as ok").get();
              db.close();
              console.log("better-sqlite3 OK under Electron ABI");
              app.exit(0);
            } catch (e) {
              console.error("better-sqlite3 FAILED under Electron:", e);
              app.exit(1);
            }
          });
          '@ | Out-File -Encoding utf8 verify-sqlite.cjs
          npx --no-install electron verify-sqlite.cjs

      - name: Build renderer + main (electron-vite)
        # CRITICAL: VITE_API_URL is baked into the bundle at BUILD time (both
        # the renderer AND the main process read it via import.meta.env). The
        # CI runner has no .env/.env.local (gitignored), so without this the
        # build falls through to http://localhost:8000 and the shipped exe
        # can't reach the server — pairing fails with "Could not reach the
        # server". Point it at the live backend. Override via repo
        # Variables (vars.POS_API_URL) if the host ever changes.
        env:
          VITE_API_URL: ${{ vars.POS_API_URL || 'https://client.invoicesolution.pk' }}
        run: npm run build

      - name: Package Windows installer (unsigned)
        env:
          # Explicitly clear signing so electron-builder doesn't try to sign.
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
        # electron-builder.yml has a `publish: generic` block. The GENERIC
        # provider is PULL-ONLY — electron-builder generates latest.yml +
        # .blockmap into release/ but uploads NOTHING (PublishManager
        # scheduleUpload returns early for provider "generic"). So --publish
        # always is safe here: it emits the auto-update metadata without needing
        # any credentials. publish-update.sh then rsyncs the 3 artifacts to the
        # VPS feed. (--publish never would SKIP latest.yml generation entirely.)
        # nodeGypRebuild:false is intentional — install-app-deps above already
        # placed the correct Electron-ABI prebuild; let electron-builder package
        # that exact binary rather than rebuild again.
        run: npx electron-builder --win --publish always

      - name: Locate the built .exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Recurse -Filter invoiceSolution.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "invoiceSolution.exe not found under release/"; exit 1 }
          Write-Host "Built: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,1)) MB)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload installer + auto-update feed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: invoiceSolution-exe
          # The .exe AND the auto-update feed files (latest.yml + .blockmap).
          # Drop ALL THREE into /srv/pos/updates/ on the server to publish an
          # update — every installed terminal then self-updates.
          path: |
            release/invoiceSolution.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
