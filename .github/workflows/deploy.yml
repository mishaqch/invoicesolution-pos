name: deploy

# Phase 8 deploy skeleton.
#
# Pulls latest main on the VPS via SSH, runs migrations, restarts
# systemd units. Idempotent: rerunning is safe.
#
# Required GitHub secrets (set in repo settings → secrets):
#   DEPLOY_HOST            — e.g. 1.2.3.4 or pos.example.com
#   DEPLOY_USER            — typically `pos`
#   DEPLOY_SSH_KEY         — private key (the matching pubkey lives in
#                            ~pos/.ssh/authorized_keys on the VPS)
#   DEPLOY_KNOWN_HOSTS     — output of `ssh-keyscan -H pos.example.com`

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Tag-only deploy is safer; uncomment when ready.
    # if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} <<'EOF'
            set -euo pipefail
            cd /srv/pos
            git fetch --all --tags
            git reset --hard origin/main
            cd backend
            /srv/pos/venv/bin/pip install -e ".[prod]" --quiet
            /srv/pos/venv/bin/python manage.py migrate --noinput
            /srv/pos/venv/bin/python manage.py collectstatic --noinput
            cd ../admin-web
            npm ci --silent
            npm run build --silent
            sudo systemctl restart pos-backend pos-celery-worker pos-celery-beat
            # Smoke
            curl --max-time 5 --fail http://localhost:8000/api/health/ready/
          EOF
