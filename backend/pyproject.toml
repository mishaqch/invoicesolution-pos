[project]
name = "pakistan-pos-backend"
version = "0.0.1"
description = "Django backend for the Pakistan POS system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.1.4",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "argon2-cffi==23.1.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.0.8",
    "django-environ==0.11.2",
    "django-cors-headers==4.4.0",
    "gunicorn==22.0.0",
    "cryptography==43.0.1",
    "qrcode[pil]==7.4.2",
    "requests==2.32.3",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "django-stubs[compatible-mypy]==5.0.4",
    "factory-boy==3.3.1",
]

# ---------------------------------------------------------------------------
# Tool config
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = ["core", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "core.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests", "apps"]
