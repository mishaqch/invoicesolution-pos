<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Lakeside Orders</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3efe7;
        color: #152625;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1514;
          color: #ecf4f1;
        }
      }
      .box {
        max-width: 340px;
      }
      .icon {
        font-size: 52px;
      }
      h1 {
        font-size: 22px;
        margin: 14px 0 6px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #4e6a63;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #9fbab2;
        }
      }
      button {
        margin-top: 18px;
        border: 0;
        cursor: pointer;
        background: #0c6a6a;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon" aria-hidden="true">📶</div>
      <h1>You're offline</h1>
      <p>
        This tablet needs a connection to take and send orders. Check the Wi-Fi and try again —
        your paired branch stays remembered.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
