# Nginx site config for the POS backend + admin web.
#
# Place this at /etc/nginx/sites-available/pos and symlink to
# /etc/nginx/sites-enabled/pos. Requires Let's Encrypt cert at
# /etc/letsencrypt/live/<host>/.

upstream pos_backend {
    # Gunicorn workers — managed by systemd (see deploy/systemd/pos-backend.service)
    server 127.0.0.1:8000 fail_timeout=5s;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    # ACME challenge for Let's Encrypt renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else gets redirected to https.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.example.com;

    ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — 6 months. Increase to 2 years once stable.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Generous body size for CSV imports + report exports.
    client_max_body_size 50M;

    # Admin web — pre-built static assets.
    location / {
        root /srv/pos/admin-web/dist;
        try_files $uri $uri/ /index.html;
        # Cache hashed assets aggressively.
        location ~* \.(js|css|woff2|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API.
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://pos_backend;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Django admin (rare; consider IP-allowlisting in production).
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://pos_backend;
    }

    # Static + media (Django collectstatic output / report exports).
    location /static/ {
        alias /srv/pos/backend/static/;
        expires 30d;
    }
    location /media/ {
        alias /srv/pos/backend/media/;
        # Reports may include sensitive data — never cache.
        add_header Cache-Control "private, no-store" always;
        # Auth is enforced at the Django layer, not here.
        proxy_pass http://pos_backend;
    }
}
