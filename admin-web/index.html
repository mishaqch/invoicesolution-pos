<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#16a34a" />
    <title>InvoiceSolution — Admin</title>
    <style>
      /* Instant boot loader — rendered from HTML before any JS downloads, so
         the user never sees a blank white screen on a slow connection. React
         replaces #root (and this loader) the moment it mounts. */
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #ffffff; color: #16a34a;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #app-boot .ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid #e5e7eb; border-top-color: #16a34a;
        animation: app-boot-spin 0.8s linear infinite;
      }
      #app-boot .brand { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
      #app-boot .hint { font-size: 12px; color: #9ca3af; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #0a0a0a; }
        #app-boot .ring { border-color: #27272a; border-top-color: #22c55e; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <div id="app-boot">
        <div class="ring"></div>
        <div class="brand">InvoiceSolution</div>
        <div class="hint">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
