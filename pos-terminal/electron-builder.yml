# electron-builder config — Phase 8.
#
# Code-signing + auto-update channel for production releases.
# Cashier machines run electron-updater on startup; it pulls metadata
# (latest.yml) and the .exe from the GitHub Releases channel below.
#
# Required environment for a release build (CI only):
#
#   # Code signing — Windows EV / OV cert in PKCS#12 form
#   CSC_LINK=<https://… or local path to .p12>
#   CSC_KEY_PASSWORD=<cert password>
#
#   # GitHub Releases publishing (where electron-updater pulls from)
#   GH_TOKEN=<token with repo scope on the releases repo>
#
#   # macOS notarization (optional; only if shipping the dmg)
#   APPLE_ID=<apple id>
#   APPLE_APP_SPECIFIC_PASSWORD=<app-specific password>
#   APPLE_TEAM_ID=<10-char team id>
#
# All variables are read by electron-builder automatically — do NOT
# echo them in CI logs and do NOT commit them. Drop them in your CI
# secret store (GitHub Actions → Settings → Secrets and variables).
#
# Without CSC_LINK + CSC_KEY_PASSWORD the build still emits a working
# .exe — but unsigned. Windows Smartscreen will warn users on first
# run. Do NOT ship unsigned builds to customers.

appId: pk.pakistanpos.terminal
productName: Pakistan POS
copyright: Copyright (c) 2026 Pakistan POS

directories:
  output: release/${version}
  buildResources: build

files:
  - "out/**/*"
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "!**/*.{md,markdown,test.js,spec.js}"
  - "!**/.eslintrc*"

asar: true

# better-sqlite3 has native bindings — keep it out of the asar so the
# .node loader can find the prebuild.
asarUnpack:
  - node_modules/better-sqlite3/**/*

nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]
  publisherName: Pakistan POS
  # Cert resolved from CSC_LINK + CSC_KEY_PASSWORD env. Override here
  # if you have an installed cert by subject name instead.
  # certificateSubjectName: "Your Company Name"
  verifyUpdateCodeSignature: true   # auto-update refuses unsigned diffs

mac:
  target:
    - dmg
  # Hardened runtime + notarization required for distribution.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true   # uses APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: support@pakistanpos.example.com

# Auto-update channel — electron-updater on the cashier machine pulls
# new versions from this GitHub Releases repo. Configure `repo` to the
# private releases repository the deployer maintains; defaults to the
# repository this build runs from when omitted.
publish:
  provider: github
  releaseType: release
  # Uncomment + fill when you split the public source repo from the
  # private release-artifact repo:
  # owner: pakistanpos
  # repo: pos-releases
