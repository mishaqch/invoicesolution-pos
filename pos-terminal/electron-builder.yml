# electron-builder config — Phase 8.
#
# Code-signing + auto-update channel for production releases.
# Cashier machines run electron-updater on startup; it pulls metadata
# (latest.yml) and the .exe from the GitHub Releases channel below.
#
# Required environment for a release build (CI only):
#
#   # Code signing — Windows EV / OV cert in PKCS#12 form
#   CSC_LINK=<https://… or local path to .p12>
#   CSC_KEY_PASSWORD=<cert password>
#
#   # GitHub Releases publishing (where electron-updater pulls from)
#   GH_TOKEN=<token with repo scope on the releases repo>
#
#   # macOS notarization (optional; only if shipping the dmg)
#   APPLE_ID=<apple id>
#   APPLE_APP_SPECIFIC_PASSWORD=<app-specific password>
#   APPLE_TEAM_ID=<10-char team id>
#
# All variables are read by electron-builder automatically — do NOT
# echo them in CI logs and do NOT commit them. Drop them in your CI
# secret store (GitHub Actions → Settings → Secrets and variables).
#
# Without CSC_LINK + CSC_KEY_PASSWORD the build still emits a working
# .exe — but unsigned. Windows Smartscreen will warn users on first
# run. Do NOT ship unsigned builds to customers.

appId: pk.invoicesolution.terminal
productName: InvoiceSolution
copyright: Copyright (c) 2026 InvoiceSolution

directories:
  output: release/${version}
  buildResources: build

files:
  # electron-vite emits everything to out/; `dist`/`dist-electron` were dead
  # globs from an older layout (removed).
  - "out/**/*"
  # Runtime assets read by the main process via __dirname-relative candidate
  # paths: the SQLite schema and the FBR thermal-receipt logo. electron-vite
  # doesn't bundle non-imported files, so they're packaged from source.
  - "electron/db/schema.sql"
  - "electron/assets/**/*"
  - "package.json"
  # Strip docs/tests/source/maps that ride along inside the shipped runtime
  # node_modules (only the 5 runtime deps ship now — keep them lean).
  - "!**/*.{md,markdown,test.js,spec.js,map}"
  - "!**/.eslintrc*"
  - "!**/{test,tests,__tests__,docs,example,examples,.github}/**"

asar: true

# better-sqlite3 has native bindings — keep it out of the asar so the
# .node loader can find the prebuild.
asarUnpack:
  - node_modules/better-sqlite3/**/*

nodeGypRebuild: false

# Keep electron-builder's default ("normal") compression. We deliberately do
# NOT use "maximum": it markedly increases BUILD time (the thing we're trying to
# keep fast) for a marginal extra download saving — and the big size win already
# came from shipping only the 5 runtime deps (prod node_modules ~87M → ~18M).

win:
  target:
    - target: nsis
      arch: [x64]
  # Fixed installer filename so the public download link is stable:
  #   https://client.invoicesolution.pk/download/terminal/  ->  invoiceSolution.exe
  artifactName: invoiceSolution.exe
  # Unsigned build: don't make the updater verify a code signature (there is
  # none yet). When a real cert is added later, set this to true and move the
  # signing options under `signtoolOptions` (electron-builder 26 relocated
  # publisherName + signingHashAlgorithms there).
  verifyUpdateCodeSignature: false

mac:
  target:
    - dmg
  # Hardened runtime + notarization required for distribution.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true   # uses APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID

nsis:
  # One-click install: shop staff double-click the .exe and it installs to the
  # per-user profile and launches — no admin prompt, no wizard, no directory
  # picker. Simplest possible UX for a non-technical cashier. (Set oneClick:false
  # + allowToChangeInstallationDirectory:true if IT wants the assisted wizard.)
  oneClick: true
  perMachine: false               # per-user → no UAC/admin elevation needed
  runAfterFinish: true            # launch the POS right after install
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false # keep local sales/queue if they reinstall

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: support@pakistanpos.example.com

# Auto-update / publishing is intentionally NOT configured here. This build
# produces a plain downloadable installer (hosted on our server, not GitHub
# Releases), and a `publish` block makes electron-builder try to generate
# auto-update metadata (latest.yml) — which crashes a no-channel artifact
# build. When you later set up signed auto-updates, add a `publish:` block
# (provider: github, releaseType: release) back here + use pos-release.yml.
